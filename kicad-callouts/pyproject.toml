[project]
name = "kicad-callouts"
version = "0.1.0"
description = ""Static annotated 3D board images with labelled callouts, from a KiCad PCB.""
readme = "README.md"
authors = [
    { name = "Keenan Johnson", email = "keenan@breadboardfoundry.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
kicad-callouts = "kicad_callouts:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
